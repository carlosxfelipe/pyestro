# Search in Android Settings (English-language emulator).
#   uv run pyestro test flows/settings_search.yaml
appId: com.android.settings
name: Search in settings
tags:
  - smoke
env:
  QUERY: display
---
- launchApp
- tapOn: "Search settings"
- inputText: ${QUERY}
- extendedWaitUntil:
    visible: "Display.*"
    timeout: 5000
- tapOn:
    text: "Display"
    index: 0
- assertVisible: "Brightness.*"
- takeScreenshot: settings_display
- back
